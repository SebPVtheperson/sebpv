<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SebPV.com</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #008080;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }

        .window {
            width: 100%;
            max-width: min(100%, 300px);
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000;
            background-color: #c0c0c0;
        }

        .window:has(#iframe-container:not(.hidden)) {
            max-width: min(100%, 420px);
        }

        .title-bar {
            background-color: #000080;
            color: white;
            padding: 4px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .window-content {
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .window-content p {
            margin-bottom: 20px;
        }

        .button {
            margin-top: 20px;
            padding: 10px 16px;
            min-height: 44px;
            background-color: #c0c0c0;
            border: 2px outset #fff;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            display: inline-block;
            font-family: inherit;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }

        .button:active {
            border-style: inset;
        }

        #iframe-container {
            margin-top: 1rem;
            width: 100%;
            overflow: hidden;
        }

        #iframe-container iframe {
            display: block;
            width: 100%;
            min-height: 400px;
            height: min(70vh, 600px);
            height: min(70dvh, 600px);
            border: none;
        }

        .hidden {
            display: none;
        }

        @media (min-width: 480px) {
            body {
                padding: 1.5rem;
            }

            .window {
                max-width: min(100%, 360px);
            }

            .window:has(#iframe-container:not(.hidden)) {
                max-width: min(100%, 480px);
            }

            #iframe-container iframe {
                min-height: 450px;
            }
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">SebPV.com</div>
        <div class="window-content">
            <p>For all your SebPV.com needs</p>
            <button class="button" onclick="showIframe()">Call me</button>
            <div id="iframe-container" class="hidden">
                <iframe
                    id="calendly-iframe"
                    src="https://calendly.com/sebpv/30min?month=2026-02"
                    title="Schedule a call with SebPV"
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        function showIframe() {
            document.getElementById('iframe-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
